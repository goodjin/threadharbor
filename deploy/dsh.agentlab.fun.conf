# dsh.agentlab.fun —— 手机中转入口的反代（云主机 tencent01）
#
# 落点：127.0.0.1:3080 的 DSH 实例（只监听回环，公网只经 nginx 进来）。
# 长连接：手机页的事件流走 WebSocket（/api/remote.mux，中转页另有一条），
# 所以 proxy_read_timeout 给足、proxy_buffering 关掉、Upgrade 头透传。
# 认证：在页面自己的配对凭据之外再加一层 HTTP Basic——这个入口一旦解析到公网，
# 谁扫到都能看到落地页结构，而它所在的机器还握着通往其它机器的钥匙。
# 证书：Let's Encrypt 签发，落盘在 /etc/nginx/ssl/（与 agentlab.fun 同一套路），
# 续期靠 certbot 的 renew 定时任务，续期后需要 reload 一次。
#
# 前置：本文用了 $connection_upgrade，它由 http 级的 map 定义。该 map 目前在
# /etc/nginx/conf.d/grok-web.conf 里（同机既有站点）。若哪天那个文件没了、
# 本文件还在，`nginx -t` 会因未知变量失败、整站起不来——换站点时先看一眼。
#
# 落地顺序（照这个顺序做，每一步都有它非做不可的理由）：
# 1. 先只装 :80 那个 server 块。这台机器上 grok-web.conf 有个 `server_name _`
#    的兜底站点带口令认证，精确 server_name 优先，不先装的话 ACME 校验请求
#    会被它抢走，回 401，签证书直接失败。
# 2. certonly --webroot -w /var/www/certbot -d dsh.agentlab.fun 签证书。
# 3. 证书落到 /etc/nginx/ssl/ 后再换成本文件——一次装全会因证书路径不存在而
#    `nginx -t` 失败、连原有站点一起起不来。
#
# 口令文件必须 root:nginx 640：nginx 工作进程不是 root，600 装上去它读不到，
# 每个请求都 500，日志里是 open() ... failed (13: Permission denied)。

server {
    listen 80;
    listen [::]:80;
    server_name dsh.agentlab.fun;

    # ACME 的 http-01 校验走这里，不加认证也不跳转。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dsh.agentlab.fun;

    ssl_certificate /etc/nginx/ssl/dsh.agentlab.fun_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.agentlab.fun.key;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    auth_basic "DSH Relay";
    auth_basic_user_file /etc/nginx/dsh.agentlab.fun.htpasswd;

    # 页面与接口都要 no-store：会话与凭据状态一变就该看到新的。
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # Host 透传原始域名：DSH 的可信主机栅栏按它判定，别改成 127.0.0.1。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 事件流是长连：读超时给足一小时，缓冲关掉（缓冲会把实时事件攒成块）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
