# ThreadHarbor is an out-of-tree DeepSeek Harness plugin. It keeps the stock
# Web runtime and layout, then replaces only the product-owned surface.
# NOTE: ui-conversation must stay enabled since dsh 0.1.5: the stock chat,
# goal, trajectory, deliverables and workflow-run panels consume its
# uiConversation service and never activate when it is disabled.
#
# The hostd gateway is gone (migration phase 6): agents now run as DSH-native
# ACP plugins on the machine serving the page, so there is no remote host to
# proxy to and no per-host port to configure. The ACP and preset plugins below
# replace both, and they run in-process.
#
# ui-sidebar is deliberately NOT disabled any more. It used to be, because the
# hostd-backed sidebar replaced it; now that the ACP sessions are ordinary DSH
# sessions, the stock sidebar is the correct surface, and the roll-up plugin only
# adds the view across hosts beside it.

- insert:
    - id: threadharbor-client
      name: '@threadharbor/dsh-client'
    # 主机侧的设置槽：登记簿与本机默认身份经 remote.settings 存进这份
    # profile 文档（设置跟机器走，不跟浏览器走）。浏览器侧的入口在
    # dsh-client 的 host-store.ts，写的是同一个 id 的命名空间。
    - id: threadharbor-host-store
      name: '@threadharbor/dsh-host-federation/host-store'
    # 主机侧的 Tailscale 桥：在提供页面的这台机器上跑 `tailscale status
    # --json`，把 peer 清单写进 threadharbor-host-store 的 data 字典
    # （dsh.tailscale.peers），浏览器侧的「从 Tailscale 选」读同一个键。
    # 面板自己没有执行主机命令的通道，所以这半边桥必须在这里。没有自己的
    # volatile 字段，就不会多出一个设置页；刷新走 data.dsh.tailscale.refresh。
    - id: threadharbor-tailscale
      name: '@threadharbor/dsh-host-federation/tailscale'
    - id: acp-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-codex
        name: Codex
        order: 20
        plugins:
          - id: acp-codex-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-codex
              agent: codex
              command: /Users/good/.local/bin/codex-acp
              cwd: /Users/good/Documents/deepseek-harness
              # mode 留空 = 该构建的默认 agent（"Approve for me"）。
              # 清单 = 2026-10-10 真机探针（对该命令做一次真实
              # initialize + session/new）读到的 models.availableModels，
              # 一字不差。
              models:
                - id: gpt-6-astra[low]
                  name: GPT-6-Astra (low)
                  description: Frontier intelligence for the most demanding work. Fast responses with lighter reasoning
                - id: gpt-6-astra[medium]
                  name: GPT-6-Astra (medium)
                  description: Frontier intelligence for the most demanding work. Balances speed and reasoning depth for everyday tasks
                - id: gpt-6-astra[high]
                  name: GPT-6-Astra (high)
                  description: Frontier intelligence for the most demanding work. Greater reasoning depth for complex problems
                - id: gpt-6-astra[xhigh]
                  name: GPT-6-Astra (xhigh)
                  description: Frontier intelligence for the most demanding work. Extra high reasoning depth for complex problems
                - id: gpt-6-astra[max]
                  name: GPT-6-Astra (max)
                  description: Frontier intelligence for the most demanding work. Maximum reasoning depth for the hardest problems
                - id: gpt-6-astra[ultra]
                  name: GPT-6-Astra (ultra)
                  description: Frontier intelligence for the most demanding work. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-sol[low]
                  name: GPT-5.6-Sol (low)
                  description: Older generation workhorse model. Fast responses with lighter reasoning
                - id: gpt-5.6-sol[medium]
                  name: GPT-5.6-Sol (medium)
                  description: Older generation workhorse model. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-sol[high]
                  name: GPT-5.6-Sol (high)
                  description: Older generation workhorse model. Greater reasoning depth for complex problems
                - id: gpt-5.6-sol[xhigh]
                  name: GPT-5.6-Sol (xhigh)
                  description: Older generation workhorse model. Extra high reasoning depth for complex problems
                - id: gpt-5.6-sol[max]
                  name: GPT-5.6-Sol (max)
                  description: Older generation workhorse model. Maximum reasoning depth for the hardest problems
                - id: gpt-5.6-sol[ultra]
                  name: GPT-5.6-Sol (ultra)
                  description: Older generation workhorse model. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-terra[low]
                  name: GPT-5.6-Terra (low)
                  description: Older balanced model for straightforward work. Fast responses with lighter reasoning
                - id: gpt-5.6-terra[medium]
                  name: GPT-5.6-Terra (medium)
                  description: Older balanced model for straightforward work. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-terra[high]
                  name: GPT-5.6-Terra (high)
                  description: Older balanced model for straightforward work. Greater reasoning depth for complex problems
                - id: gpt-5.6-terra[xhigh]
                  name: GPT-5.6-Terra (xhigh)
                  description: Older balanced model for straightforward work. Extra high reasoning depth for complex problems
                - id: gpt-5.6-terra[max]
                  name: GPT-5.6-Terra (max)
                  description: Older balanced model for straightforward work. Maximum reasoning depth for the hardest problems
                - id: gpt-5.6-terra[ultra]
                  name: GPT-5.6-Terra (ultra)
                  description: Older balanced model for straightforward work. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-luna[low]
                  name: GPT-5.6-Luna (low)
                  description: Older fast and efficient model. Fast responses with lighter reasoning
                - id: gpt-5.6-luna[medium]
                  name: GPT-5.6-Luna (medium)
                  description: Older fast and efficient model. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-luna[high]
                  name: GPT-5.6-Luna (high)
                  description: Older fast and efficient model. Greater reasoning depth for complex problems
                - id: gpt-5.6-luna[xhigh]
                  name: GPT-5.6-Luna (xhigh)
                  description: Older fast and efficient model. Extra high reasoning depth for complex problems
                - id: gpt-5.6-luna[max]
                  name: GPT-5.6-Luna (max)
                  description: Older fast and efficient model. Maximum reasoning depth for the hardest problems
    - id: acp-claude
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-claude
        name: Claude
        order: 30
        plugins:
          - id: acp-claude-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-claude
              agent: claude
              command: /Users/good/.local/bin/claude-agent-acp
              cwd: /Users/good/Documents/deepseek-harness
              # claude 默认 bypassPermissions，不显式写 default 它永远不问。
              mode: default
              # 清单 = 2026-10-10 真机探针（对该命令做一次真实
              # initialize + session/new）读到的 model 配置项 options，
              # 一字不差。
              models:
                - id: default
                  name: Default (recommended)
                  description: iquest-q1[1m]
                - id: opus
                  name: iquest-q1
                  description: Custom Opus model
                - id: fable
                  name: iquest-q1
                  description: Custom Fable model
                - id: sonnet
                  name: iquest-q1
                  description: Custom Sonnet model
                - id: haiku
                  name: iquest-q1
                  description: Custom Haiku model
    - id: acp-grok
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-grok
        name: Grok
        order: 25
        plugins:
          - id: acp-grok-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-grok
              agent: grok
              # grok 不是 stdio 子进程，而是一个 WebSocket 服务：preset-dispatch
              # 会先拉起 `grok agent serve`（随机端口 + 密钥、等它就绪、关闭时
              # 回收），再连上它返回的 ws url。command 指向 grok 二进制本身。
              command: /Users/good/.local/bin/grok
              cwd: /Users/good/Documents/deepseek-harness
              # 清单 = 2026-10-09 真机探针（captured-frames.json 的 session/new）
              # 读到的 availableModels，一字不差。
              models:
                - id: grok-4.7
                  name: Grok 4.7
    - id: acp-cursor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-cursor
        name: Cursor
        order: 35
        plugins:
          - id: acp-cursor-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-cursor
              agent: cursor
              # cursor 的 ACP 走 stdio：`agent ... acp` 一配就自启动。
              # 注意：cursor 的二进制也叫 agent，但 ~/.local/bin/agent 是 grok
              # 的（会冲突）——这里必须指向 cursor 自己的 agent 二进制。本机
              # 装好后改成真实路径，例如 ~/.local/bin/cursor-agent。
              command: /Users/good/.local/bin/cursor-agent
              cwd: /Users/good/github/threadharbor
              # cursor 的 modelId 带配置后缀（grok-4.7[context=256k,...]），是
              # 不同的配置组合而非推理档位，不能按 effort 归并——否则不同的
              # 配置会被压成一行。关掉归并，每个 id 独立成行。
              collapseEfforts: false
              # 清单 = 2026-09-14 真机探针（captured-frames.cursor.json 的
              # session/new）读到的 availableModels，一字不差。
              models:
                - id: grok-4.7[context=256k,reasoning_effort=high,fast=true]
                  name: grok-4.7
                - id: claude-opus-5-5[context=300k,effort=medium,fast=false]
                  name: claude-opus-5-5
