# ThreadHarbor is an out-of-tree DeepSeek Harness plugin. It keeps the stock
# Web runtime and layout, then replaces only the product-owned surface.
# NOTE: ui-conversation must stay enabled since dsh 0.1.5: the stock chat,
# goal, trajectory, deliverables and workflow-run panels consume its
# uiConversation service and never activate when it is disabled.
#
# The hostd gateway is gone (migration phase 6): agents now run as DSH-native
# ACP plugins on the machine serving the page, so there is no remote host to
# proxy to and no per-host port to configure. The ACP and preset plugins below
# replace both, and they run in-process.
#
# ui-sidebar is deliberately NOT disabled any more. It used to be, because the
# hostd-backed sidebar replaced it; now that the ACP sessions are ordinary DSH
# sessions, the stock sidebar is the correct surface, and the roll-up plugin only
# adds the view across hosts beside it.

- insert:
    - id: threadharbor-client
      name: '@threadharbor/dsh-client'