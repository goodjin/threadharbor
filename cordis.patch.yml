# ThreadHarbor is an out-of-tree DeepSeek Harness plugin. It is a multi-host
# federation plugin: it keeps the stock Web runtime and layout, then adds the
# host-side multi-host surface and the browser UI that drives it.
#
# This one package plays two roles (DSH allows several):
#   - bundle (host): the five host-side plugin rows below, all from this repo's
#     packages/dsh-host-federation.
#   - client (browser): the federation UI (host panel, cross-machine sidebar,
#     pairing, SSH deploy surfaces), declared under `dsh.client` in
#     package.json and built into lib/client.js.
#
# The boundary, 2026-11: agents (ACP presets, quota capsules, roster filter,
# mermaid asset) no longer live here. They moved to @goodjin2/dsh-acp-agent,
# which ships its own cordis.patch.yml. Install that plugin alongside this one
# for the agent surface; this repo stays purely multi-host.
#
# NOTE: ui-conversation must stay enabled since dsh 0.1.5: the stock chat,
# goal, trajectory, deliverables and workflow-run panels consume its
# uiConversation service and never activate when it is disabled.
#
# Agents run as DSH-native ACP plugins on each machine (migration phase 6
# removed the old hostd proxy and its per-host port settings). Another
# machine's sessions stay on that machine. threadharbor-host-gateway on the
# machine serving this page forwards the browser's ordinary DSH calls there.
#
# ui-sidebar is deliberately NOT disabled any more. It used to be, because the
# hostd-backed sidebar replaced it; now that the ACP sessions are ordinary DSH
# sessions, the stock sidebar is the correct surface, and this plugin only adds
# the cross-host view beside it.

- insert:
    # 主机侧的设置槽：登记簿与本机默认身份经 remote.settings 存进这份
    # profile 文档（设置跟机器走，不跟浏览器走）。浏览器侧的入口在
    # src/client/host-store.ts，写的是同一个 id 的命名空间。
    - id: threadharbor-host-store
      name: '@goodjin2/dsh-host-federation/host-store'
    # 主机侧的 Tailscale 桥：在提供页面的这台机器上跑 `tailscale status
    # --json`，把 peer 清单写进 threadharbor-host-store 的 data 字典
    # （dsh.tailscale.peers），浏览器侧的「从 Tailscale 选」读同一个键。
    # 面板自己没有执行主机命令的通道，所以这半边桥必须在这里。没有自己的
    # volatile 字段，就不会多出一个设置页；刷新走 data.dsh.tailscale.refresh。
    - id: threadharbor-tailscale
      name: '@goodjin2/dsh-host-federation/tailscale'
    - id: threadharbor-ssh-deploy
      name: '@goodjin2/dsh-host-federation/ssh-deploy'
    # 同源网关：浏览器仍调 DSH 自己的接口，只是路径挂在本机
    # /threadharbor/gateway/<主机标识>/ 下面，由这台机器转到登记簿里的地址。
    # 登录 cookie 留在这台机器上，不写进浏览器，也不接收浏览器传来的任意网址。
    - id: threadharbor-host-gateway
      name: '@goodjin2/dsh-host-federation/host-gateway'
    # 主机互通：浏览器报到自己的身份，宿主铸出带令牌的入口，再把「自己 +
    # 登记簿」推给每一台已知主机；对端只补缺失、不改本机已登记的地址与
    # SSH 事实。手机配对接口也在这里（完整 DSH 界面，不是中转页）。
    - id: threadharbor-federation-sync
      name: '@goodjin2/dsh-host-federation/federation-sync'
    # 浏览器 UI（联邦界面）：主机面板、跨机侧栏、手机配对、SSH 部署界面。
    # 由 package.json 的 dsh.client 声明装载到 web 平台，构建产物在
    # lib/client.js（同一包的第二个角色）。
    - id: threadharbor-client
      name: '@goodjin2/dsh-threadharbor/client'
