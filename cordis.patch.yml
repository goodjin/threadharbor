# ThreadHarbor is an out-of-tree DeepSeek Harness plugin. It keeps the stock
# Web runtime and layout, then replaces only the product-owned surface.
# NOTE: ui-conversation must stay enabled since dsh 0.1.5: the stock chat,
# goal, trajectory, deliverables and workflow-run panels consume its
# uiConversation service and never activate when it is disabled.
#
# Agents run as DSH-native ACP plugins on each machine (migration phase 6
# removed the old hostd proxy and its per-host port settings). Another
# machine's sessions stay on that machine. threadharbor-host-gateway on the
# machine serving this page forwards the browser's ordinary DSH calls there.
#
# ui-sidebar is deliberately NOT disabled any more. It used to be, because the
# hostd-backed sidebar replaced it; now that the ACP sessions are ordinary DSH
# sessions, the stock sidebar is the correct surface, and the roll-up plugin only
# adds the view across hosts beside it.

- insert:
    - id: threadharbor-client
      name: '@threadharbor/dsh-client'
    # 主机侧的设置槽：登记簿与本机默认身份经 remote.settings 存进这份
    # profile 文档（设置跟机器走，不跟浏览器走）。浏览器侧的入口在
    # dsh-client 的 host-store.ts，写的是同一个 id 的命名空间。
    - id: threadharbor-host-store
      name: '@threadharbor/dsh-host-federation/host-store'
    # 主机侧的 Tailscale 桥：在提供页面的这台机器上跑 `tailscale status
    # --json`，把 peer 清单写进 threadharbor-host-store 的 data 字典
    # （dsh.tailscale.peers），浏览器侧的「从 Tailscale 选」读同一个键。
    # 面板自己没有执行主机命令的通道，所以这半边桥必须在这里。没有自己的
    # volatile 字段，就不会多出一个设置页；刷新走 data.dsh.tailscale.refresh。
    - id: threadharbor-tailscale
      name: '@threadharbor/dsh-host-federation/tailscale'
    - id: threadharbor-ssh-deploy
      name: '@threadharbor/dsh-host-federation/ssh-deploy'
    # 同源网关：浏览器仍调 DSH 自己的接口，只是路径挂在本机
    # /threadharbor/gateway/<主机标识>/ 下面，由这台机器转到登记簿里的地址。
    # 登录 cookie 留在这台机器上，不写进浏览器，也不接收浏览器传来的任意网址。
    - id: threadharbor-host-gateway
      name: '@threadharbor/dsh-host-federation/host-gateway'
    # 主机互通：浏览器报到自己的身份，宿主铸出带令牌的入口，再把「自己 +
    # 登记簿」推给每一台已知主机；对端只补缺失、不改本机已登记的地址与
    # SSH 事实。手机配对接口也在这里（完整 DSH 界面，不是中转页）。
    - id: threadharbor-federation-sync
      name: '@threadharbor/dsh-host-federation/federation-sync'
    # 手机中转（云主机侧，独立部署）：公网 HTTPS 入口，由它经 SSH 隧道代理到各机的
    # DSH。**它自己也出手机页**（hub 模式：页面壳 + pair-url + peers + 中转 API 同源），
    # 所以这是中转唯一的插件——直连那套已取消，要直连某台机器就用那台机器自己的
    # 原生 DSH web，不再单独挂 mobile-entry 入口。本机不配中转时它默认停用、不注册。
    - id: threadharbor-mobile-relay
      name: '@threadharbor/dsh-mobile-relay'
    # 名册过滤器不点名。每个要藏起的 preset 在自己的 binding 上打
    # hideFromRoster: true；过滤器只认这个标记（以及行上的同名字段）。
    # 新增 agent 只要打标记，不必改过滤器配置。内部 list() 仍不过滤。
    - id: threadharbor-roster-filter
      name: '@threadharbor/dsh-preset-dispatch/roster-filter'
    # GLM 套餐限额接口：宿主解密本机 ZCode 登录密钥后问一次 Coding Plan 的
    # monitor 地址，把 5 小时/周两个窗口的数字发回；浏览器侧输入框下方的
    # 配额胶囊从这里读（密钥不出宿主进程，成功应答带 30 秒缓存）。
    - id: threadharbor-zcode-quota
      name: '@threadharbor/dsh-preset-dispatch/zcode-quota'
    - id: acp-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-codex
        name: Codex
        order: 20
        plugins:
          - id: acp-codex-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-codex
              agent: codex
              hideFromRoster: true
              command: /Users/good/.local/bin/codex-acp
              # 静默看门狗的期限放宽到 5 分钟（默认 120 秒）。
              #
              # 2026-10-21 桌面版现场：codex 在大仓里干活（一万个文件的索引）
              # 时，工具结果落地后它要等模型的下一次回答；这一等常常超过两分钟，
              # 而它在等的时候不吐任何帧——在外面看与「卡死」一模一样，120 秒的
              # 看门狗就把这一轮杀了（同一会话当天四次 ACP_STALLED）。进程没死、
              # stderr 也是空的，它只是在等。
              stallMs: 300000
              # 不写 cwd。写了也会被忽略。
              # 外部会话只用这条 DSH 会话自己的工作区；没有工作区就不开工。
              # mode 留空 = 该构建的默认 agent（"Approve for me"）。
              # 清单 = 2026-10-10 真机探针（对该命令做一次真实
              # initialize + session/new）读到的 models.availableModels，
              # 一字不差。
              models:
                - id: gpt-6-astra[low]
                  name: GPT-6-Astra (low)
                  description: Frontier intelligence for the most demanding work. Fast responses with lighter reasoning
                - id: gpt-6-astra[medium]
                  name: GPT-6-Astra (medium)
                  description: Frontier intelligence for the most demanding work. Balances speed and reasoning depth for everyday tasks
                - id: gpt-6-astra[high]
                  name: GPT-6-Astra (high)
                  description: Frontier intelligence for the most demanding work. Greater reasoning depth for complex problems
                - id: gpt-6-astra[xhigh]
                  name: GPT-6-Astra (xhigh)
                  description: Frontier intelligence for the most demanding work. Extra high reasoning depth for complex problems
                - id: gpt-6-astra[max]
                  name: GPT-6-Astra (max)
                  description: Frontier intelligence for the most demanding work. Maximum reasoning depth for the hardest problems
                - id: gpt-6-astra[ultra]
                  name: GPT-6-Astra (ultra)
                  description: Frontier intelligence for the most demanding work. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-sol[low]
                  name: GPT-5.6-Sol (low)
                  description: Older generation workhorse model. Fast responses with lighter reasoning
                - id: gpt-5.6-sol[medium]
                  name: GPT-5.6-Sol (medium)
                  description: Older generation workhorse model. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-sol[high]
                  name: GPT-5.6-Sol (high)
                  description: Older generation workhorse model. Greater reasoning depth for complex problems
                - id: gpt-5.6-sol[xhigh]
                  name: GPT-5.6-Sol (xhigh)
                  description: Older generation workhorse model. Extra high reasoning depth for complex problems
                - id: gpt-5.6-sol[max]
                  name: GPT-5.6-Sol (max)
                  description: Older generation workhorse model. Maximum reasoning depth for the hardest problems
                - id: gpt-5.6-sol[ultra]
                  name: GPT-5.6-Sol (ultra)
                  description: Older generation workhorse model. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-terra[low]
                  name: GPT-5.6-Terra (low)
                  description: Older balanced model for straightforward work. Fast responses with lighter reasoning
                - id: gpt-5.6-terra[medium]
                  name: GPT-5.6-Terra (medium)
                  description: Older balanced model for straightforward work. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-terra[high]
                  name: GPT-5.6-Terra (high)
                  description: Older balanced model for straightforward work. Greater reasoning depth for complex problems
                - id: gpt-5.6-terra[xhigh]
                  name: GPT-5.6-Terra (xhigh)
                  description: Older balanced model for straightforward work. Extra high reasoning depth for complex problems
                - id: gpt-5.6-terra[max]
                  name: GPT-5.6-Terra (max)
                  description: Older balanced model for straightforward work. Maximum reasoning depth for the hardest problems
                - id: gpt-5.6-terra[ultra]
                  name: GPT-5.6-Terra (ultra)
                  description: Older balanced model for straightforward work. Maximum reasoning with automatic task delegation
                - id: gpt-5.6-luna[low]
                  name: GPT-5.6-Luna (low)
                  description: Older fast and efficient model. Fast responses with lighter reasoning
                - id: gpt-5.6-luna[medium]
                  name: GPT-5.6-Luna (medium)
                  description: Older fast and efficient model. Balances speed and reasoning depth for everyday tasks
                - id: gpt-5.6-luna[high]
                  name: GPT-5.6-Luna (high)
                  description: Older fast and efficient model. Greater reasoning depth for complex problems
                - id: gpt-5.6-luna[xhigh]
                  name: GPT-5.6-Luna (xhigh)
                  description: Older fast and efficient model. Extra high reasoning depth for complex problems
                - id: gpt-5.6-luna[max]
                  name: GPT-5.6-Luna (max)
                  description: Older fast and efficient model. Maximum reasoning depth for the hardest problems
    - id: acp-claude
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-claude
        name: Claude
        order: 30
        plugins:
          - id: acp-claude-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-claude
              agent: claude
              hideFromRoster: true
              command: /Users/good/.local/bin/claude-agent-acp
              # claude 默认 bypassPermissions，不显式写 default 它永远不问。
              mode: default
              # 清单 = 2026-10-10 真机探针（对该命令做一次真实
              # initialize + session/new）读到的 model 配置项 options，
              # 一字不差。
              models:
                - id: default
                  name: Default (recommended)
                  description: iquest-q1[1m]
                - id: opus
                  name: iquest-q1
                  description: Custom Opus model
                - id: fable
                  name: iquest-q1
                  description: Custom Fable model
                - id: sonnet
                  name: iquest-q1
                  description: Custom Sonnet model
                - id: haiku
                  name: iquest-q1
                  description: Custom Haiku model
    - id: acp-grok
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-grok
        name: Grok
        order: 25
        plugins:
          - id: acp-grok-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-grok
              agent: grok
              hideFromRoster: true
              # grok 不是 stdio 子进程，而是一个 WebSocket 服务：preset-dispatch
              # 会先拉起 `grok agent serve`（随机端口 + 密钥、等它就绪、关闭时
              # 回收），再连上它返回的 ws url。command 指向 grok 二进制本身。
              command: /Users/good/.local/bin/grok
              # 静默看门狗的期限放宽到 5 分钟（默认 120 秒）。
              #
              # 2026-10-28 桌面版现场（session-983e4ad7）：grok 说完最后一段
              # 文字就转入自动压缩上下文（它自己的 updates.jsonl 记着 93% /
              # 238k token），此后 120 秒零帧，看门狗把这一轮杀了。这台机器上
              # 历史压缩耗时 50–121 秒，120 秒的期限本身就贴着最坏情况；与
              # codex / qoder 一样改成 5 分钟。
              stallMs: 300000
              # 清单 = 2026-10-23 真机探针（grok 1.0.67 的 session/new）
              # 读到的 availableModels，一字不差。
              #
              # 2026-10-23 桌面版现场：清单里只写了 grok-4.7，而当时跑着的
              # grok 进程报的是 grok-4.6 / grok-4.5（它的模型清单缓存在
              # ~/.grok/models_cache.json，缓存旧了就不含 4.7）。用户在选择器里
              # 点了 grok-4.7，agent 那边根本没有这个模型，这一轮直接作废。
              # 清单写成真机的样子，选择器在 agent 自己报清单之前就不会给出
              # agent 做不到的选项。
              models:
                - id: grok-4.7
                  name: Grok 4.7
                - id: grok-4.7-build-fast
                  name: Grok 4.7 Fast
                - id: grok-4.6
                  name: Grok 4.6
                - id: grok-4.5
                  name: Grok 4.5
    - id: acp-cursor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-cursor
        name: Cursor
        order: 35
        plugins:
          - id: acp-cursor-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-cursor
              agent: cursor
              hideFromRoster: true
              # cursor 的 ACP 走 stdio：`agent ... acp` 一配就自启动。
              # 注意：cursor 的二进制也叫 agent，但 ~/.local/bin/agent 是 grok
              # 的（会冲突）——这里必须指向 cursor 自己的 agent 二进制。本机
              # 装好后改成真实路径，例如 ~/.local/bin/cursor-agent。
              command: /Users/good/.local/bin/cursor-agent
              # cursor 的 modelId 带配置后缀（grok-4.7[context=256k,...]），是
              # 不同的配置组合而非推理档位，不能按 effort 归并——否则不同的
              # 配置会被压成一行。关掉归并，每个 id 独立成行。
              collapseEfforts: false
              # 清单 = 2026-09-14 真机探针（captured-frames.cursor.json 的
              # session/new）读到的 availableModels，一字不差。
              models:
                - id: grok-4.7[context=256k,reasoning_effort=high,fast=true]
                  name: grok-4.7
                - id: claude-opus-5-5[context=300k,effort=medium,fast=false]
                  name: claude-opus-5-5
    - id: acp-zcode
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-zcode
        name: ZCode
        order: 40
        plugins:
          - id: acp-zcode-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-zcode
              agent: zcode
              hideFromRoster: true
              # zcode 是模型插件，不是 ACP 进程。本机 ZCode 登录密钥解密后，
              # 对话按 Coding Plan 的地址发给 GLM；读文件、跑命令、审批、
              # 取消和会话记录仍由 DSH 自己的循环处理。模型出现在列表的
              # ZCode 这一组里。默认推理档是 high；选 none 会关掉思考。
              # 国际站账号把 ZCODE_GLM_BASE_URL 设成
              # https://api.z.ai/api/anthropic 。
              models:
                - id: GLM-5.3
                  name: GLM 5.3
                  description: GLM Coding Plan
                - id: GLM-5.3-Flash
                  name: GLM 5.3-Flash
                  description: GLM Coding Plan
                - id: GLM-5.2
                  name: GLM 5.2
                  description: GLM Coding Plan
    - id: acp-minimax
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-minimax
        name: MiniMax
        order: 45
        plugins:
          - id: acp-minimax-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-minimax
              agent: minimaxi
              hideFromRoster: true
              # minimaxi 是模型插件，不拉起任何进程。本机 MiniMax Code 的登录
              # 凭据按官方那套路径与刷新逻辑读取（与桌面版共用同一个文件和同一把
              # 锁），对话发给 MiniMax 的托管网关；区域从凭据所在目录读出，国内站
              # 自动走 agent.minimax.cn。读文件、跑命令、审批、取消和会话记录仍由
              # DSH 自己的循环处理。
              #
              # 没装或没登录 MiniMax Code 时，这一组模型发消息会直接失败并说明
              # 去哪登录——本插件不另设密钥。
              #
              # 思考档位是 MiniMax 自己的 low/medium/high/xhigh/max；M3.1-Flash
              # 关不掉思考，选 none 会被忽略（官方对 disabled 直接返回 2013）。
              models:
                - id: MiniMax-M3.1-Flash
                  name: M3.1 Flash
                  description: MiniMax Code 登录
                - id: MiniMax-M3
                  name: MiniMax M3
                  description: MiniMax Code 登录
    - id: acp-qoder
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: acp-qoder
        name: Qoder
        order: 50
        plugins:
          - id: acp-qoder-binding
            name: '@threadharbor/dsh-preset-dispatch'
            config:
              presetId: acp-qoder
              agent: qoder
              hideFromRoster: true
              # Qoder 的 CLI 默认是交互式 agent；`--acp` 由共享参数表补上
              # （packages/dsh-acp-agent/src/spawn-args.ts），这里不重复。
              # 国际站把 command 指向 `qoder`/`qodercli`；本机是 CN 版。
              command: /Users/good/.local/bin/qoderclicn
              # 静默看门狗的期限放宽到 5 分钟（默认 120 秒）。
              #
              # 2026-10-28 桌面版现场（会话 a655a45d）：qoder 执行长工具（跑了个
              # python 并发下载测速）期间一个帧都不发——模型请求期间思考帧照常流，
              # 不发帧的是工具在跑的那段。那个工具跑满约 120 秒被 qoder 自己的
              # Bash 超时终止（18:35:12.956），我们的 120 秒看门狗 5 毫秒后跟进
              # （18:35:12.961），而它马上就要开始下一轮模型请求（+300ms）——
              # 两个 120 秒定时器的赛跑，放宽到 5 分钟后 qoder 自己的超时先解决
              # 战斗，回合不死。与 acp-codex 同款放宽。
              stallMs: 300000
              # 登录走 `qoderclicn login`，凭据留在 CLI 自己的
              # ~/.qoder-cn 配置目录。无头部署可改用 PAT：
              # 宿主进程设 QODERCN_PERSONAL_ACCESS_TOKEN 即自动登录（官方
              # ACP 文档写明的路径；spawn 的 env 白名单会放行它，见
              # spawn-args.ts）。已登录时会话不需要 authenticate；只有 session/new
              # 报认证错误时才补一次 authenticate 并重试（2026-10-20 实测：
              # 已登录时调用 authenticate 偶尔会挂满超时）。
              # 默认模式就是逐次询问；写出来是不让构建的默认值漂移。
              mode: default
              # 清单 = 2026-10-20 真机探针（qoder-cli-cn 1.1.6，真实
              # initialize + session/new）读到的 models.availableModels，一字不差。
              models:
                - id: auto
                  name: Auto (default)
                  description: Reasoning · Vision · 0.50x Credit
                - id: fast
                  name: Fast
                  description: Reasoning · Vision · 0.80x Credit
                - id: qmodel_38max
                  name: Qwen3.8-Max
                  description: Reasoning · Vision · New · 0.50x Credit
                - id: qfmodel
                  name: Qwen3.8-Flash
                  description: Reasoning · Vision · New · 0.00x Credit
                - id: qmodel_latest
                  name: Qwen3.7-Max
                  description: Reasoning · Vision · New · 0.50x Credit
                - id: qmodel
                  name: Qwen3.7-Plus
                  description: Reasoning · Vision · New · 0.10x Credit
                - id: q37fmodel
                  name: Qwen3.7-Flash
                  description: Reasoning · Vision · New · 0.10x Credit
                - id: dmodel
                  name: DeepSeek-V4-Pro
                  description: Reasoning · Vision · New · 0.50x Credit
                - id: dfmodel
                  name: DeepSeek-Flash
                  description: Vision · New · 0.00x Credit
                - id: gmodel
                  name: GLM-5.3
                  description: Reasoning · Vision · New · 0.80x Credit
                - id: gfmodel
                  name: GLM-5.3-Flash
                  description: Reasoning · Vision · New · 0.10x Credit
                - id: gm51model
                  name: GLM-5.2
                  description: Reasoning · Vision · New · 0.60x Credit
                - id: kmodel_latest
                  name: Kimi-K3
                  description: Vision · New · 1.40x Credit
                - id: kmodel
                  name: Kimi-K2.8-Preview
                  description: Reasoning · Vision · New · 0.80x Credit
                - id: mmodel
                  name: MiniMax-M3.1-Flash
                  description: Vision · New · 0.10x Credit
