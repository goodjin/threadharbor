<!doctype html>
<!-- 手机页应用壳（无构建链）：本页只挂容器与资源引用——界面与文案出自
     views.js 纯函数，编排与 DOM 挂接在 app.js，样式在 app.css。资源用绝对
     路径：/threadharbor/mobile 与 /threadharbor/mobile/ 两种拼写都伺服本页，
     相对路径在无斜杠拼写下会落到错误前缀。 -->
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ThreadHarbor 手机端</title>
    <link rel="stylesheet" href="/threadharbor/mobile/app.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript><p class="boot-loading">本页需要启用 JavaScript 才能连接主机。</p></noscript>
    <script type="module" src="/threadharbor/mobile/app.js"></script>
    <!-- 自举：app.js 只导出 bootApp，不自己启动——它在用例里被直接调用，
         真浏览器里由这一行启动。用相对路径：页面在 /threadharbor/mobile/ 下，
         前缀将来变了也不会指到别处去。
         bootApp 自己接住启动期的失败（渲染错误屏），这里不 await、不再包一层
         try：包了反而会把「启动失败」这件事藏起来。 -->
    <script type="module">
      import { bootApp } from './app.js'
      const root = document.getElementById('app')
      if (root !== null) void bootApp(root)
    </script>
  </body>
</html>
