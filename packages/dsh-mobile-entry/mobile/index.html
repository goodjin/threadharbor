<!doctype html>
<!-- 手机页应用壳（无构建链）：本页只挂容器与资源引用——界面与文案出自
     views.js 纯函数，编排与 DOM 挂接在 app.js，样式在 app.css。资源用绝对
     路径：/threadharbor/mobile 与 /threadharbor/mobile/ 两种拼写都伺服本页，
     相对路径在无斜杠拼写下会落到错误前缀。 -->
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ThreadHarbor 手机端</title>
    <link rel="stylesheet" href="/threadharbor/mobile/app.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript><p class="boot-loading">本页需要启用 JavaScript 才能连接主机。</p></noscript>
    <!-- 模式占位：服务端把赋值右侧那个占位符换成 {"mode":"machine"} 或
         {"mode":"hub"}（见 src/static-serve.ts 的 CONFIG_LINE）。原样打开这个
         文件（不经服务端）时它是 undefined，app.js 按缺省走直连——所以这个
         占位不是「必须被替换」的硬依赖。注释里刻意不写出占位符本身，免得服务端
         按裸占位符替换时先改掉这里。 -->
    <script>window.__THREADHARBOR_MOBILE__ = __MOBILE_CONFIG__</script>
    <script type="module" src="/threadharbor/mobile/app.js"></script>
  </body>
</html>
